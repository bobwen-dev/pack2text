[package]
name = "pack2text"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
sha2 = "0.10"
walkdir = "2"
rand = "0.8"
arboard = "3"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }
